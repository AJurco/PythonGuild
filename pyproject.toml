[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "PGT"
version = "0.1.0"
description = "PythonGuild talk"
readme = "README.md"
requires-python = "==3.14.3"


dependencies = [
  "ipykernel"
]


[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = ["-v"]
testpaths = ["tests"]
pythonpath = ["src"]
